<svg xmlns="http://www.w3.org/2000/svg" width="680" height="528" viewBox="0 0 680 528" role="img" aria-labelledby="pipeline-title pipeline-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="pipeline-title">Chisel to SystemVerilog 컴파일 파이프라인 (이 프로젝트가 실제로 진행한 범위)</title>
  <desc id="pipeline-desc">Chisel(Scala) 코드가 elaboration을 거쳐 FIRRTL 중간표현으로, 다시 CIRCT/firtool을 통해 SystemVerilog로 컴파일되고, Verilator로 시뮬레이션·lint 검증까지 진행한 과정을 보여주는 다이어그램. 합성 단계는 이 프로젝트 범위 밖이라 제외함.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="528" fill="#FFFFFF"/>

  <rect x="160" y="40" width="360" height="64" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="66" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Chisel 코드</text>
  <text x="340" y="86" text-anchor="middle" font-size="12" fill="#444441">Scala 프로그램 (DSL)</text>

  <line x1="340" y1="104" x2="340" y2="168" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="130" font-size="12" fill="#5F5E5A">Scala 실행 → elaboration</text>
  <text x="430" y="148" font-size="12" fill="#5F5E5A">회로 그래프(FIRRTL) 생성</text>

  <rect x="160" y="168" width="360" height="64" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="194" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">FIRRTL</text>
  <text x="340" y="214" text-anchor="middle" font-size="12" fill="#3C3489">중간 표현 (IR)</text>

  <line x1="340" y1="232" x2="340" y2="296" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="258" font-size="12" fill="#5F5E5A">CIRCT / firtool 컴파일</text>
  <text x="430" y="276" font-size="12" fill="#5F5E5A">최적화 후 SV 텍스트 출력</text>

  <rect x="160" y="296" width="360" height="64" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="322" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">SystemVerilog</text>
  <text x="340" y="342" text-anchor="middle" font-size="12" fill="#085041">최종 RTL 텍스트</text>

  <line x1="340" y1="360" x2="340" y2="424" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="386" font-size="12" fill="#5F5E5A">Verilator로 빌드</text>
  <text x="430" y="404" font-size="12" fill="#5F5E5A">시뮬레이션 · lint 검증</text>

  <rect x="160" y="424" width="360" height="64" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="450" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Verilator</text>
  <text x="340" y="470" text-anchor="middle" font-size="12" fill="#444441">시뮬레이션 · lint 검증</text>
</svg>
